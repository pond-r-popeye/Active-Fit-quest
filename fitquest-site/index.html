setCard=function(s,ed){const E=exs(s);return`<div class="c"><div class="row" style="align-items:flex-start"><div style="flex:3"><b>${IC[s.type]} ${esc(s.name)}</b> ${ed?`<a href="#" onclick="eSet('${s.id}');return false">✎</a>`:""}<div>${eqOf(s).map(x=>`<span class="chip">🧰 ${esc(x)}</span>`).join("")||'<span class="chip">🧰 –</span>'}${s.rd>1?`<span class="chip">🔁 ${s.rd} รอบ</span>`:""}</div><button class="pri" style="margin-top:8px" onclick="play('${s.id}')">▶ เริ่มเล่น</button></div>${mm(musOf(s))}</div><div style="margin-top:10px">${E.map((e,i)=>`<div class="wi"><div class="th">${thumb(e)}</div><div class="dt"><b>${i+1}. ${esc(e.name)}</b><div>${planChips(e)}</div></div></div>`).join("")}</div></div>`};
vSets=function(){const all=["w","c","y"].flatMap(k=>S.sets.filter(s=>s.type==k));return`<h3>เซ็ตท่าออกกำลังกาย</h3>`+(all.length?`<div class="cr" id="cr">${all.map(s=>`<div class="cs" data-t="${s.type}">${setCard(s,1)}</div>`).join("")}</div>`:'<div class="c mu">ยังไม่มีเซ็ต</div>')+`<div class="tyb" id="tyb">${["w","c","y"].map(k=>`<button data-t="${k}" onclick="crTo('${k}')">${IC[k]} ${TY[k]}<span>${S.sets.filter(s=>s.type==k).length}</span></button>`).join("")}</div><h4>+ เพิ่มเซ็ตใหม่</h4><div class="row">${["w","c","y"].map(k=>`<button class="pri" onclick="eSet('','${k}')">${IC[k]} ${TY[k]}</button>`).join("")}</div>`};
function crFx(w){const W=w.clientWidth||1;let best=0,bd=1e9;[...w.children].forEach((c,i)=>{const d=((c.offsetLeft+c.offsetWidth/2-w.scrollLeft)-W/2)/W,a=Math.min(1,Math.abs(d)*1.6);if(Math.abs(d)<bd){bd=Math.abs(d);best=i}c.style.transform=`scale(${1-.07*a})`;c.style.opacity=1-.45*a});CRI=best;const t=w.children[best]&&w.children[best].dataset.t;document.querySelectorAll("#tyb button").forEach(b=>b.classList.toggle("on",b.dataset.t==t))}
function crTo(k){const w=$("#cr");if(!w)return;const c=[...w.children].find(x=>x.dataset.t==k);if(!c)return toast("ยังไม่มีเซ็ต "+TY[k]);w.scrollTo({left:c.offsetLeft+c.offsetWidth/2-w.clientWidth/2,behavior:"smooth"})}
const _r20=render;render=function(){_r20();const w=$("#cr");if(w){let t;w.addEventListener("scroll",()=>{cancelAnimationFrame(t);t=requestAnimationFrame(()=>crFx(w))},{passive:true});requestAnimationFrame(()=>{const c=w.children[Math.min(CRI,w.children.length-1)];if(c)w.scrollTo({left:c.offsetLeft+c.offsetWidth/2-w.clientWidth/2,behavior:"instant"});crFx(w)})}};
render();

const _r21=render;render=function(){_r21();const w=$("#cr");if(!w||w.parentElement.classList.contains("crw"))return;const wrap=document.createElement("div");wrap.className="crw";w.before(wrap);wrap.appendChild(w);wrap.insertAdjacentHTML("beforeend",'<button class="crb l" onclick="crStep(-1)" aria-label="เซ็ตก่อนหน้า">‹</button><button class="crb r" onclick="crStep(1)" aria-label="เซ็ตถัดไป">›</button>');w.tabIndex=0;w.addEventListener("keydown",e=>{if(e.key=="ArrowRight"){e.preventDefault();crStep(1)}else if(e.key=="ArrowLeft"){e.preventDefault();crStep(-1)}});w.addEventListener("dragstart",e=>e.preventDefault())};
